[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-extractor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1.7",
    "openai>=3.50.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.0",
    "pypdf>=7.0.0",
    "sqlglot>=30.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/mcp_server", "src/guardrail",
    "src/tools", "src/client",
    "scr/schema"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
